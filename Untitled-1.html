<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Company Flip Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .flip-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .flip-card {
        background-color: transparent;
        width: 100%;
        height: 180px;
        perspective: 1000px;
        cursor: pointer;
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }

      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }

      .flip-card-front,
      .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.1rem;
        border-radius: 12px;
        backface-visibility: hidden;
        padding: 10px;
        text-align: center;
      }

      .flip-card-front {
        /* background: linear-gradient(135deg, #667eea, #764ba2); */
        /* background: linear-gradient(0deg, #183e77, #0b2743) !important; */
        background: linear-gradient(0deg, #1f4e9c, #0e3556);
        font-size: 1.5rem !important;
      }

      .flip-card-back {
        /* background: linear-gradient(135deg, #ff758c, #ff7eb3); */
        /* background: linear-gradient(0deg, #183e77, #0b2743) !important;

        transform: rotateY(180deg); */
        color: #000000;
        transform: rotateY(180deg);
        background: linear-gradient(0deg, #d9b03c, #f6e5a0);
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <div class="row">
        <div class="col-6">
          <div class="flip-container">
            <!-- 9 Flip Cards -->
            <div class="flip-card" data-count="32">
              <div class="flip-card-inner">
                <div class="flip-card-front">Google</div>
                <div class="flip-card-back">
                  32k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="25">
              <div class="flip-card-inner">
                <div class="flip-card-front">Meta</div>
                <div class="flip-card-back">
                  25k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="19">
              <div class="flip-card-inner">
                <div class="flip-card-front">Amazon</div>
                <div class="flip-card-back">
                  19k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="22">
              <div class="flip-card-inner">
                <div class="flip-card-front">Microsoft</div>
                <div class="flip-card-back">
                  22k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="16">
              <div class="flip-card-inner">
                <div class="flip-card-front">Apple</div>
                <div class="flip-card-back">
                  16k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="10">
              <div class="flip-card-inner">
                <div class="flip-card-front">Netflix</div>
                <div class="flip-card-back">
                  10k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="14">
              <div class="flip-card-inner">
                <div class="flip-card-front">Adobe</div>
                <div class="flip-card-back">
                  14k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="18">
              <div class="flip-card-inner">
                <div class="flip-card-front">Tesla</div>
                <div class="flip-card-back">
                  18k <br />
                  Students
                </div>
              </div>
            </div>

            <div class="flip-card" data-count="11">
              <div class="flip-card-inner">
                <div class="flip-card-front">Nvidia</div>
                <div class="flip-card-back">
                  11k <br />
                  Students
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-6">
          <!-- You can put other content here -->
          <h4>Other Content</h4>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        // Click to flip
        $(".flip-card").on("click", function () {
          $(this).toggleClass("flipped");
        });

        // Auto flip random cards every 2 seconds
        setInterval(() => {
          let cards = $(".flip-card");
          let randomIndex = Math.floor(Math.random() * cards.length);
          let $card = $(cards[randomIndex]);
          $card.toggleClass("flipped");
        }, 2000);
      });
    </script>
  </body>
</html>
