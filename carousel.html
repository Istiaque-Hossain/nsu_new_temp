<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alumni Carousel with Arrows</title>

    <!-- Bootstrap CSS (optional, for card style) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
      .swiper-slide {
        text-align: center;
        padding: 10px;
      }

      .swiper-slide .card {
        border: none;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .swiper-slide img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 50%;
        margin-top: 15px;
      }

      .swiper-slide h6 {
        font-weight: 600;
        margin-top: 10px;
      }

      /* Position navigation arrows */
      .swiper-button-next,
      .swiper-button-prev {
        color: #000;
        background: #ffffff;
        padding: 25px;
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      }

      .swiper-button-next:hover,
      .swiper-button-prev:hover {
        background: #f0f0f0;
      }

      .swiper-button-prev,
      .swiper-button-next {
        --swiper-navigation-size: 25px;
      }
    </style>
  </head>
  <body>
    <div class="container py-5 position-relative">
      <div class="swiper alumniSwiper">
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide">
            <div class="card">
              <img src="https://via.placeholder.com/100" alt="Alumni 1" />
              <div class="card-body">
                <h6>John Doe</h6>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="card">
              <img src="https://via.placeholder.com/100" alt="Alumni 2" />
              <div class="card-body">
                <h6>Jane Smith</h6>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="card">
              <img src="https://via.placeholder.com/100" alt="Alumni 3" />
              <div class="card-body">
                <h6>Michael Lee</h6>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="card">
              <img src="https://via.placeholder.com/100" alt="Alumni 4" />
              <div class="card-body">
                <h6>Sarah Khan</h6>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="card">
              <img src="https://via.placeholder.com/100" alt="Alumni 5" />
              <div class="card-body">
                <h6>David Johnson</h6>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="card">
              <img src="https://via.placeholder.com/100" alt="Alumni 6" />
              <div class="card-body">
                <h6>Nina Patel</h6>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Arrow Navigation -->
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Init Swiper -->
    <script>
      const swiper = new Swiper(".alumniSwiper", {
        slidesPerView: 4,
        spaceBetween: 20,
        loop: true,
        speed: 800,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        breakpoints: {
          0: { slidesPerView: 1 },
          576: { slidesPerView: 2 },
          768: { slidesPerView: 3 },
          992: { slidesPerView: 4 },
        },
      });
    </script>
  </body>
</html>
